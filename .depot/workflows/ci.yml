name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l gate.go plugins)"
      - name: Validate Depot workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -config-file .depot/actionlint.yml -shellcheck= -pyflakes= .depot/workflows/*.yml
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - run: python3 -m unittest discover -s scripts -p '*_test.py'

  binaries:
    needs: test
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check release tag matches the Gate dependency
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/gate_release.py check-tag "$RELEASE_TAG"
      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean --skip=publish
      - name: Build snapshot binaries
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --snapshot --clean --skip=publish
      - name: Check platform coverage and checksums
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/gate_release.py prepare "$RELEASE_TAG"
      - name: Verify Linux binary starts
        run: |
          binary=$(jq -r '.[] | select(.name == "gate" and .goos == "linux" and .goarch == "amd64" and .extra.ID == "gate") | .path' dist/artifacts.json)
          test -n "$binary"
          "$binary" --version
      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-binaries
          path: release/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: binaries
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-binaries
          path: release
      - name: Upload, verify, and publish release
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha256sum --check checksums.txt
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            test "$(jq -r .isDraft existing-release.json)" = true || {
              echo "Release $RELEASE_TAG is already published; refusing to replace it."
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" gate_* checksums.txt --clobber
          verify_dir=$(mktemp -d)
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          cmp checksums.txt "$verify_dir/checksums.txt"
          (cd "$verify_dir" && sha256sum --check checksums.txt)
          gh release edit "$RELEASE_TAG" --draft=false
